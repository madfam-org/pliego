# Dependency updates: weekly, grouped, Monday morning in Mexico City. Security updates are not grouped away:
# GitHub opens them as soon as an advisory lands. The kernel is standard-library only and the engine has zero
# dependencies, so the ecosystems here are the API's pip requirements, the actions and the base image.
version: 2
updates:
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /scripts/qa
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Mexico_City
