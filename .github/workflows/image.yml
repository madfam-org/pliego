# Image: build the production Dockerfile on every pull request that can change the image, and boot it once.
#
# CI never built the image (A3 audit, 2026-10-18): build-deploy.yml is dispatch-only, so a Dockerfile that no longer
# builds or boots (a base-image bump such as Dependabot's python 3.14-slim, a COPY that lost its source, a
# requirement that will not install) was found only by a production dispatch. This builds the same Dockerfile, with
# the commons checked out and the build-time prerender included (about 4.5 min on 4 cores: it is the step that
# exercises the image's Python with the kernel, so it stays in), loads it into the runner's Docker WITHOUT pushing,
# then runs it read-only as uid 1001 and checks /health and /ready.
#
# Paths: every COPY source in the Dockerfile (the same set build-deploy.yml's `paths` carries,
# scripts/qa/verify_deploy_paths.py), the Dockerfile and .dockerignore, and this workflow.
#
# GitHub-hosted runners only, pinned to ubuntu-24.04 (ruling R116). Every action is pinned to a full commit SHA (tag
# in the comment); permissions are read-only. Nothing is pushed, signed or deployed.

name: Image

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - apps/**
      - packages/**
      - docs/spec/**
      - materials/**
      - projects
      - llms.txt
      - llms-full.txt
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Docker image (build, no push) and in-container smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Commons pin guard (first; the Dockerfile also fails closed on an empty projects/)
        run: python scripts/qa/verify_commons_pin.py --require --min-cartridges 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push; loaded into the runner's Docker for the smoke)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: pliego:ci
          build-args: |
            PLIEGO_REVISION=${{ github.sha }}
      - name: Smoke (read-only root, uid 1001, /tmp only; /health and /ready)
        env:
          WANT_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker image inspect pliego:ci --format 'image: {{.Id}} size={{.Size}}'
          docker run -d --name pliego --read-only --tmpfs /tmp --user 1001:1001 --cap-drop ALL \
            --security-opt no-new-privileges \
            -e PLIEGO_CORS_ORIGINS=https://pliego.madfam.io,https://pliego-app.madfam.io \
            -p 127.0.0.1:8000:8000 pliego:ci
          ok=0
          for _ in $(seq 1 60); do
            if curl -fsS -o "$RUNNER_TEMP/health.json" http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then echo "smoke: FAIL /health never answered 200 within 120 s"; docker logs pliego; exit 1; fi
          code=$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://127.0.0.1:8000/ready)
          echo "health: $(cat "$RUNNER_TEMP/health.json")"
          echo "ready: ${code} $(cat "$RUNNER_TEMP/ready.json")"
          python - "$RUNNER_TEMP/health.json" "$code" <<'PY'
          import json, os, sys
          h = json.load(open(sys.argv[1]))
          problems = []
          if h.get("status") != "ok": problems.append(f"status={h.get('status')!r}")
          if not h.get("commons"): problems.append("commons=0")
          if h.get("commons_invalid"): problems.append(f"commons_invalid={h['commons_invalid']}")
          if not h.get("stocks") or h.get("stocks_invalid"): problems.append(f"stocks={h.get('stocks')} invalid={h.get('stocks_invalid')}")
          if not h.get("prerendered"): problems.append("prerendered=0 (the build-time warm tier is empty)")
          if h.get("thumbnails") != h.get("commons"): problems.append(f"thumbnails={h.get('thumbnails')} commons={h.get('commons')}")
          if h.get("revision") != os.environ["WANT_REVISION"]: problems.append(f"revision={h.get('revision')!r}")
          if sys.argv[2] != "200": problems.append(f"/ready answered {sys.argv[2]}")
          for p in problems: print(f"smoke: FAIL {p}")
          print(f"smoke: commons={h.get('commons')} stocks={h.get('stocks')} prerendered={h.get('prerendered')} "
                f"thumbnails={h.get('thumbnails')} kernel={h.get('kernel')} problems={len(problems)}")
          sys.exit(1 if problems else 0)
          PY
      - name: Container log
        if: always()
        # The default shell has no pipefail, so a missing container (a failed build) only prints the error.
        run: docker logs pliego 2>&1 | tail -50
