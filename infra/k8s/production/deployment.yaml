# Pliego: one pod serves the landing (pliego.madfam.io), the studio (pliego-app.madfam.io) and the API
# (pliego-api.madfam.io) behind the Cloudflare tunnel (enclii.yaml; no Ingress object). The tunnel reaches
# Service pliego on port 80, i.e. this pod's port 8000 (NetworkPolicy allow-tunnel-ingress).
# Two listeners: http on 8000 (the app) and metrics on 9090 (/metrics, never routed through the tunnel;
# Service pliego-metrics, the scraper's namespace only).
# The process is the image's own command (gunicorn apps.api.app:app on 8000; root Dockerfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pliego
  labels:
    app.kubernetes.io/name: pliego
    app.kubernetes.io/component: app
    # Required for the platform's NetworkPolicy admission.
    app.kubernetes.io/part-of: madfam-platform
  annotations:
    # A Secret change (intake or rotation) does not restart pods on its own.
    reloader.stakater.com/auto: "true"
spec:
  # Two pods, so a rollout or a node drain never empties the Service (PodDisruptionBudget pliego keeps one).
  # Both pods are interchangeable: each has its own render cache (memory + /tmp), the prerendered tier is baked
  # into the image, the API holds no sign-in or session state, and rate limits are per worker (docs/RUNBOOK.md).
  # ENCLII TRAP: Enclii's Argo Application ignores a Deployment's spec.replicas (RespectIgnoreDifferences), so
  # this value does NOT reach the live object on sync; the owner scales once (docs/DEPLOYMENT.md "Rollouts").
  # Keep it equal to runtime.replicas in enclii.yaml (scripts/qa/verify_rollout_safety.py).
  replicas: 2
  revisionHistoryLimit: 3
  # Surge, never unavailable: the new pod must pass /ready before an old one stops, so even at one live
  # replica a rollout is not an outage.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: pliego
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pliego
        app.kubernetes.io/component: app
        app.kubernetes.io/part-of: madfam-platform
        # Enclii convention labels (the platform selects the service's pods by these).
        app: pliego
        enclii.dev/service: pliego
    spec:
      automountServiceAccountToken: false
      # Soft spread across nodes: a preference, not a rule, so a one-node pool still schedules both pods.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: pliego
      # Kubernetes injects <SERVICE>_PORT=tcp://<ip>:<port> (and friends) for every Service in the namespace
      # unless this is false. The Service `pliego` produced PLIEGO_PORT=tcp://…:80, which collided with the
      # app's own PLIEGO_PORT and crash-looped the first deploy (gunicorn: invalid literal for int()).
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: pliego
          # DECOY: the real pin is the images: block in kustomization.yaml.
          image: ghcr.io/madfam-org/pliego:latest
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 9090
          env:
            - name: PLIEGO_ENV
              value: production
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            # Hosts (owner ruling 2026-10-10); scripts/qa/verify_canonical_host.py keeps these, the CORS
            # list below and enclii.yaml's domains in lockstep.
            - name: PLIEGO_PUBLIC_LANDING_HOST
              value: pliego.madfam.io
            - name: PLIEGO_PUBLIC_APP_HOST
              value: pliego-app.madfam.io
            - name: PLIEGO_PUBLIC_API_HOST
              value: pliego-api.madfam.io
            # Explicit allowlist; wildcards are banned. The landing and the studio call the API cross-origin.
            - name: PLIEGO_CORS_ORIGINS
              value: https://pliego.madfam.io,https://pliego-app.madfam.io
            # Janua: tokens carry the public issuer; the JWKS is fetched over 443 (allow-https-egress).
            - name: PLIEGO_JANUA_ISSUER
              value: https://auth.madfam.io
            - name: PLIEGO_JANUA_AUDIENCE
              value: pliego-api
            - name: PLIEGO_JANUA_JWKS_URL
              value: https://auth.madfam.io/.well-known/jwks.json
            # Rate limits key on the tunnel's client-IP header, never on the first X-Forwarded-For hop.
            - name: PLIEGO_TRUSTED_PROXY_HEADER
              value: CF-Connecting-IP
            - name: PLIEGO_METRICS_PORT
              value: "9090"
            # Heavy cartridges (paper-doily, kaleidocycle) need 20–30 s of CPU on a first render; the render
            # cache answers repeats in milliseconds. 60 s keeps first renders from timing out (504).
            - name: PLIEGO_RENDER_TIMEOUT_S
              value: "60"
            # From the intake (Secret pliego-secrets; names in secrets-template.yaml). Optional until the intake
            # writes them: the app fails closed (sign-in answers 503) while a key is absent.
            - name: AUTH_JANUA_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: pliego-secrets, key: AUTH_JANUA_CLIENT_ID, optional: true }
            - name: AUTH_JANUA_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: pliego-secrets, key: AUTH_JANUA_CLIENT_SECRET, optional: true }
            - name: PLIEGO_SESSION_SECRET
              valueFrom:
                secretKeyRef: { name: pliego-secrets, key: PLIEGO_SESSION_SECRET, optional: true }
            # AI stays inert: SELVA_BASE_URL is unset in wave 1, so every AI route answers 503.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            # Renders are bursty CPU work (one per worker): a low request, a burst limit of 2 cores.
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 2000m, memory: 384Mi }
          # Liveness is a static 200 with no dependency checks.
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness proves the catalog, the stock cards and the commons loaded (503 until they do).
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
