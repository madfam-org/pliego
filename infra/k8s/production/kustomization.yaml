apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The namespace is created by the platform at onboarding (with its platform labels); this base never declares a
# Namespace object or an Ingress. The public hosts are tunnel routes Enclii writes from enclii.yaml (pliego,
# pliego-app and pliego-api -> Service pliego:80), and the tunnel peer is admitted to the app port (8000) only
# (network-policy.yaml).
#
# secrets-template.yaml is NOT a resource: it documents the Secret's key NAMES. The Secret itself is written by
# the Enclii secret intake; an ExternalSecret joins this list only after the secret datum exists.
namespace: pliego

resources:
- deployment.yaml
- poddisruptionbudget.yaml
- service.yaml
- service-metrics.yaml
- network-policy.yaml
- servicemonitor.yaml

# Image digest: pinned by the Build & Deploy workflow (Enclii's reusable build-publish runs
# `kustomize edit set image <image>=<image>@sha256:...`, commits the pin to main, and the GitOps sync rolls it).
# The all-zero digest is a PLACEHOLDER the first successful build overwrites; it never resolves, so nothing can
# run unpinned before a real pin lands. The workload names the image with a `:latest` decoy that this block
# rewrites to the digest (the rendered manifest carries no tag at all).
images:
- digest: sha256:421e8a70f874deeaa77113f79600f5f69def147dd3597bad4778228afbbf2e31
  name: ghcr.io/madfam-org/pliego
  newName: ghcr.io/madfam-org/pliego
