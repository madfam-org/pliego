# NAMES ONLY. This file is documentation, not a resource: kustomization.yaml does not list it and nothing
# applies it. The real Secret is written by the Enclii secret intake (`enclii secrets intake`); values never
# enter this repository, a pull request or a CI log. An ExternalSecret joins the kustomize base only after the
# secret datum exists.
#
# Every key is optional at boot (deployment.yaml marks the references optional): the app fails closed — sign-in
# and AI answer 503 — while a key is absent, and /ready reports which capability is off.
apiVersion: v1
kind: Secret
metadata:
  name: pliego-secrets
  namespace: pliego
type: Opaque
stringData:
  # Janua confidential client pliego-web (janua.client.yaml); delivered by Enclii's OIDC provisioner.
  AUTH_JANUA_CLIENT_ID: ""
  AUTH_JANUA_CLIENT_SECRET: ""
  # The studio's own session-signing key (never the Janua client secret). Generated by the intake.
  PLIEGO_SESSION_SECRET: ""
  # Selva gateway token, only once the owner enables AI (SELVA_BASE_URL is set in deployment.yaml then).
  SELVA_API_TOKEN: ""
