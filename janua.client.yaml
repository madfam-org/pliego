# Janua registrations for Pliego. Names only: NO client ids or secrets live here. Ids and secrets are created
# by Enclii's OIDC provisioner and land in the secret store, from which the pod's Secret pliego-secrets is
# written (infra/k8s/production/secrets-template.yaml lists the key names).
#
# Hosts are proposed, pending the owner's word (enclii.yaml). scripts/qa/verify_canonical_host.py fails CI when
# a redirect URI here names a host enclii.yaml does not declare.
#
# Two registrations:
#   1. the API as a resource server (audience pliego-api): it validates Janua RS256 tokens and mints none;
#   2. the studio as a confidential client (pliego-web): the same container signs people in on the studio host
#      (authorization code with PKCE) and calls the API with their access tokens.

resource_server: pliego-api
client_type: resource_server
audiences:
  - pliego-api
scopes:
  - name: pliego:read
    description: Read the person's saved sheet documents, assemblies and studio settings.
  - name: pliego:write
    description: Create, edit and delete the person's sheet documents and assemblies. Implies pliego:read.
  - name: pliego:export
    description: >-
      Export the person's documents as fabrication files (SVG/DXF/PDF cut, score and fold sheets) and as
      sheet documents. Public commons objects export without sign-in.
  - name: pliego:admin
    description: Operate the service's own catalog administration. Granted to maintainers only.
token_endpoint: https://auth.madfam.io/api/v1/oauth/token
jwks_uri: https://auth.madfam.io/.well-known/jwks.json
issuer: https://auth.madfam.io

clients:
  - name: pliego-web
    type: confidential
    grant_types:
      - authorization_code
      - refresh_token
    pkce: S256
    # Janua matches redirect URIs exactly: no wildcards, no trailing-slash variants.
    redirect_uris:
      - https://pliego-app.madfam.io/auth/callback
    post_logout_redirect_uris:
      - https://pliego-app.madfam.io/
    sign_in_scopes:
      - openid
      - email
      - profile
      - offline_access
    # Access tokens are minted for the API's audience with these scopes.
    audience: pliego-api
    api_scopes:
      - pliego:read
      - pliego:write
      - pliego:export
    secrets_delivered_to:
      target: pliego/web-oidc
      properties:
        - auth_janua_client_id
        - auth_janua_client_secret

notes: |
  Validation (API): RS256 signature against the JWKS, iss == issuer, aud == pliego-api, and the route's
  required scope. HS256 is refused. Missing or invalid token -> 401; wrong audience or missing scope -> 403.
  The commons catalog and public exports are anonymous; saving and private exports need a token.
  Account switching and RP-initiated logout are supported from day one (post_logout_redirect_uris).
