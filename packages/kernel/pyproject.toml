[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pliego-kernel"
version = "0.3.0"
description = "Pliego sheet-hyperobject kernel: crease patterns, cuts, assemblies and fold programs (import name: pliego)"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Innovaciones MADFAM SAS de CV" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
